# Every push and pull request: the bot's checks, the dashboard / Mini App tests and the JS check.
# They run on tests/fixtures/bot.sqlite (a sample catalog, no people), never on real data.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff==0.8.6
      - name: lint (errors only)
        run: ruff check --select F,E9 bot tools
      - run: python tools/test_bot_fixes.py
        env:
          PYTHONIOENCODING: utf-8

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, gd, intl, mbstring, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: code style (Laravel Pint, changed lines are not enforced yet: report only)
        run: vendor/bin/pint --test || true
      - run: php artisan test
      - run: node tests/js/location.test.cjs
