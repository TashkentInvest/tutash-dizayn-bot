# /etc/nginx/sites-available/3dot   (setup.sh runs certbot, which adds the 443 block to this server block)
# Rate-limit zones (app, leads) come from /etc/nginx/conf.d/tutash-limits.conf.
server {
    listen 80;
    listen [::]:80;
    server_name 3dot.uz www.3dot.uz;
    server_tokens off;

    # one canonical address
    if ($host = www.3dot.uz) { return 301 https://3dot.uz$request_uri; }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # compress text (static pages and scripts of the site; nothing here carries secrets)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    client_max_body_size 64k;                    # the contact form is tiny

    # contact form: a few per minute per visitor is plenty
    location = /api/lead {
        limit_req zone=leads burst=3 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # not "append": the visitor must not be able to fake their address
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        limit_req zone=app burst=60 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
