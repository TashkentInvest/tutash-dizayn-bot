# /etc/nginx/conf.d/tutash-limits.conf  (http context). Installed by provision.sh and set-domain.sh.
# Over the limit nginx answers 429 and logs "limiting requests/connections" (fail2ban watches those lines).
limit_req_status  429;
limit_conn_status 429;

limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;     # login page loads
limit_req_zone  $binary_remote_addr zone=lw:10m    rate=120r/m;   # Livewire (the login form posts here)
limit_req_zone  $binary_remote_addr zone=files:10m rate=30r/m;    # starting a download
limit_req_zone  $binary_remote_addr zone=app:10m   rate=10r/s;    # everything else of the dashboard
limit_conn_zone $binary_remote_addr zone=perip:10m;               # simultaneous downloads per visitor
limit_conn_zone $server_name        zone=total:1m;                # simultaneous downloads in total

reset_timedout_connection on;
client_header_timeout 15s;
keepalive_timeout 30s;

# 3dot.uz website
limit_req_zone  $binary_remote_addr zone=leads:10m rate=6r/m;     # the contact form (/api/lead)
