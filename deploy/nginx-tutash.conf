# /etc/nginx/sites-available/tutash   (provision.sh fills in YOUR-DOMAIN and runs certbot, which adds the 443 block)
# Rate-limit zones live in /etc/nginx/conf.d/tutash-limits.conf (provision.sh writes it):
#   limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
#   limit_req_zone  $binary_remote_addr zone=files:10m rate=30r/m;
#   limit_conn_zone $binary_remote_addr zone=perip:10m;

# ---- PUBLIC: only the signed download links are reachable from the internet -------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;
    server_tokens off;

    location /f/ {
        limit_req zone=files burst=20 nodelay;
        limit_conn perip 4;                      # at most 4 simultaneous downloads per IP
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;                     # stream big PDFs, don't spool them to nginx's disk
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
    }

    # everything else (dashboard, photos, ...) is NOT public: use the SSH tunnel below
    location / { return 404; }
}

# ---- PRIVATE: the admin dashboard, only on the server's own loopback address -------------------------------
#   from your PC:   ssh -i ~/.ssh/id_ed25519_tutash -L 8000:127.0.0.1:8081 root@SERVER
#   then open:      http://127.0.0.1:8000/admin
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;

    root /srv/tutash/web/public;
    index index.php;

    client_max_body_size 2g;                     # street PDFs up to 2 GB
    client_body_timeout 1h;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 1h;
    }

    location ~ /\.(?!well-known) { deny all; }   # .env, .git ...
}
