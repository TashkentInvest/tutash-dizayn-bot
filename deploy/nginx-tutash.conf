# /etc/nginx/sites-available/tutash     (provision.sh / set-domain.sh fill in YOUR-DOMAIN and run certbot,
# which adds the 443 block to the main server block below)
#
# ONE domain serves both: the signed download links (/f/...) and the admin dashboard (/admin).
# Rate-limit zones live in /etc/nginx/conf.d/tutash-limits.conf (deploy/nginx-limits.conf).

# ---- anything that is not our domain (raw IP, an old name still pointing here): no answer ---------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# ---- the real domain ---------------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/tutash/web/public;
    index index.php;

    client_max_body_size 2g;                     # street PDFs uploaded from the dashboard, up to 2 GB
    client_body_timeout 1h;

    # signed download links, served by the bot's own small server (never exposed directly)
    location /f/ {
        limit_req zone=files burst=20 nodelay;
        limit_conn perip 4;                      # at most 4 simultaneous downloads per IP
        limit_conn total 40;                     # and 40 in total: the link server can never be swamped
        limit_rate 8m;                           # ~64 Mbit/s per download: nobody can hog the whole uplink
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;                     # stream big PDFs, don't spool them to nginx's disk
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
    }

    # login: slow down page loads, and the Livewire endpoint that actually checks the password
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location ^~ /livewire {
        limit_req zone=lw burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=app burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        limit_req zone=app burst=40 nodelay;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 1h;
    }

    location ~ /\.(?!well-known) { deny all; }   # .env, .git ...
}

# ---- private copy of the dashboard on the server's own loopback (SSH tunnel, works even if DNS/TLS break) ---------
#   from your PC:   ssh -i ~/.ssh/id_ed25519_tutash -L 8000:127.0.0.1:8081 root@SERVER
#   then open:      http://127.0.0.1:8000/admin     (needs SESSION_SECURE_COOKIE=false while you use it)
server {
    listen 127.0.0.1:8081;
    server_name _;
    server_tokens off;
    root /srv/tutash/web/public;
    index index.php;
    client_max_body_size 2g;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 1h;
    }
    location ~ /\.(?!well-known) { deny all; }
}
