# /etc/nginx/sites-available/tutash   (TLS: sudo certbot --nginx -d YOUR-DOMAIN)
# Rate-limit zones go in the http {} context, e.g. /etc/nginx/conf.d/tutash-limits.conf:
#   limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
#   limit_req_zone  $binary_remote_addr zone=files:10m rate=30r/m;
#   limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name YOUR-DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name YOUR-DOMAIN;
    # ssl_certificate / ssl_certificate_key: filled in by certbot

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /srv/tutash/web/public;
    index index.php;

    # signed download links served by the bot's own small server (never exposed directly)
    location /f/ {
        limit_req zone=files burst=20 nodelay;
        limit_conn perip 4;                      # at most 4 simultaneous downloads per IP
        proxy_pass http://127.0.0.1:8787;
        proxy_buffering off;                     # stream big PDFs, don't spool them to nginx's disk
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
    }

    # dashboard login: slow down password guessing
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # file uploads from the dashboard (street PDFs up to 2 GB)
    client_max_body_size 2g;
    client_body_timeout 1h;

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 1h;
    }

    location ~ /\.(?!well-known) { deny all; }   # .env, .git ...
}
