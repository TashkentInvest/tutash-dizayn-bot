; /etc/php/8.4/fpm/conf.d/99-tutash.ini
; Uploads of street PDFs (up to 2 GB). Keep in step with nginx client_max_body_size.
upload_max_filesize = 2048M
post_max_size = 2060M
memory_limit = 512M
max_execution_time = 3600
max_input_time = 3600

; hardening
expose_php = Off
display_errors = Off
log_errors = On
session.cookie_httponly = 1
session.cookie_secure = 1
