# Public dashboard on its own domain. enable-dashboard-domain.sh fills APP-DOMAIN / APP-ALIASES and runs certbot,
# which adds the 443 block to this same server block.
server {
    listen 80;
    listen [::]:80;
    server_name APP-DOMAIN APP-ALIASES;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /srv/tutash/web/public;
    index index.php;

    client_max_body_size 2g;                     # street PDFs up to 2 GB
    client_body_timeout 1h;

    # the login page: slow down page loads, and the Livewire endpoint that actually checks the password
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location ^~ /livewire {
        limit_req zone=lw burst=40 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 1h;
    }

    location ~ /\.(?!well-known) { deny all; }   # .env, .git ...
}
